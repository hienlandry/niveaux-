function noteOf(arr,perf,off,lower){
  let r=-1;
  for(let i=0;i<arr.length;i++){ if(lower?perf<=arr[i]+1e-9:perf>=arr[i]-1e-9){r=i;break;} }
  if(r<0)return 1;
  return Math.max(1,Math.min(20,20-(r-off)));
}

const $=id=>document.getElementById(id);

function build(){

  $("age").innerHTML=AGES[ex].map((a,i)=>`<option value="${i}">${a}</option>`).join("");
  $("fields").innerHTML='<label>Épreuve</label><select id="ep"><option value="">— Choisir l\'épreuve —</option>'+
    cols().map(c=>`<option value="${c.k}">${c.l}</option>`).join("")+'</select><div id="perf"></div>';
  $("ep").value=prev;if($("ep").value!==prev)$("ep").value="";
  $("ep").onchange=perfField;
  perfField();
  $("res").innerHTML="";
}
function perfField(){
  const k=$("ep").value;
  if(!k){$("perf").innerHTML="";return;}
  const c=cols().find(x=>x.k===k);
  if(c.t==="min"){
    $("perf").innerHTML='<label>Performance <span class="unit">(minutes / secondes)</span></label><div class="row"><input id="pm" inputmode="numeric" placeholder="min"><input id="ps" inputmode="numeric" placeholder="sec"></div>';
  }else if(c.t==="sec"){
    $("perf").innerHTML='<label>Performance <span class="unit">(secondes, ex. 12,3)</span></label><input id="pv" inputmode="decimal" placeholder="0,0">';
  }else{
    $("perf").innerHTML='<label>Performance <span class="unit">(mètres, ex. 4,25)</span></label><input id="pv" inputmode="decimal" placeholder="0,00">';
  }
  $("res").innerHTML="";
}
const pf=v=>{v=(v||"").trim().replace(",",".");if(v==="")return null;const x=parseFloat(v);return isNaN(x)||x<=0?NaN:x;};
const pz=v=>{v=(v||"").trim().replace(",",".");if(v==="")return null;const x=parseFloat(v);return isNaN(x)||x<0?NaN:x;};
const fr=(x,d=2)=>x.toFixed(d).replace(".",",");
$("exam").onchange=build;$("sex").onchange=build;

$("calc").onclick=()=>{
  if(mode()!=="ok"&&mode()!=="trial"){refresh();return;}
  const ex=$("exam").value,sx=$("sex").value,off=+$("age").value,k=$("ep").value;
  const err=m=>{$("res").innerHTML='<div class="card" style="color:#c0282d">'+m+'</div>';};
  if(!k){err("Choisissez d'abord l'épreuve.");return;}
  const c=cols().find(x=>x.k===k);
  let val,txt;
  if(c.t==="min"){
    const mm=pz($("pm").value),ss=pz($("ps").value);
    if(mm===null&&ss===null){err("Saisissez la performance.");return;}
    if((mm!==null&&isNaN(mm))||(ss!==null&&isNaN(ss))){err("Valeur incorrecte (utilisez des chiffres positifs).");return;}
    val=(mm||0)*60+(ss||0);if(val<=0){err("Valeur incorrecte (utilisez des chiffres positifs).");return;}txt=(mm||0)+"'"+String(Math.round(ss||0)).padStart(2,"0")+'"';
  }else{
    val=pf($("pv").value);
    if(val===null){err("Saisissez la performance.");return;}
    if(isNaN(val)){err("Valeur incorrecte (utilisez des chiffres positifs).");return;}
    txt=c.t==="sec"?fr(val,1)+" s":fr(val)+" m";
  }
  const note=noteOf(c.a,val,off,c.t!=="m");
  $("res").innerHTML='<div class="card"><h2>'+TITRE[ex]+' · '+(sx==="F"?"Fille":"Garçon")+' · '+AGES[ex][off]+'</h2>'+

    '<div class="avg">Note<br><b>'+note+' / 20</b></div></div>';

      manual=false;$("code").value="";
      await sync();
      if(ST.mode!=="ok"&&ST.mode!=="offline")e.textContent="Ce code n'est plus valable.";
    }
  }catch(x){e.textContent="Connexion Internet requise.";}
  b.disabled=false;
};
$("retry").onclick=sync;
$("sbtn").onclick=()=>{manual=true;refresh();};
$("close").onclick=()=>{manual=false;refresh();};
$("code").addEventListener("input",function(){
  const v=norm(this.value).slice(0,16);this.value=v.replace(/(.{4})(?=.)/g,"$1-");
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync();});
window.addEventListener("online",sync);
setInterval(()=>{
  tick++;
  if(!document.hidden&&ST.mode==="trial"){
    pending++;ST.left=Math.max(0,ST.left-1);
    if(ST.left===0)sync();
  }
  if(tick%15===0)sync();
  refresh();
},1000);

build();refresh();sync();
</script>
</body>
</html>
